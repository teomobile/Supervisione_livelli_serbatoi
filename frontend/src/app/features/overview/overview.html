<div class="page">
  @if (!store.loaded()) {
    <div class="panel empty">
      {{ store.error() ? 'Backend non raggiungibile.' : 'Caricamento dati…' }}
    </div>
  } @else {
    <div class="zones" [class.stale]="store.isStale()">
      @for (z of zones(); track z.code) {
        <section class="zone">
          <div class="zone-label" [class.horn-on]="z.hornActive">
            <span class="zone-name">{{ z.label }}</span>
            @if (z.role) {
              <span class="role">{{ z.role }}</span>
            }
            <span class="horn">
              <span class="horn-label">Sirena</span>
              <span class="state" [class.alarm]="z.hornActive" [class.blink]="z.hornActive">
                {{ z.hornActive ? 'Attiva' : 'Spenta' }}
              </span>
            </span>
          </div>
          @for (t of z.tanks; track t.code) {
            <app-tank-tile [tank]="t" />
          }
        </section>
      }
    </div>
  }
</div>
